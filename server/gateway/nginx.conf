# ============================================================
# Buyzaar - E-Commerce Microservices API Gateway
# Nginx Configuration
# ============================================================

# ============================================================
# Worker Configuration
# ============================================================

events {
    worker_connections 1024;
}

# ============================================================
# HTTP Configuration
# ============================================================

http {

    # --------------------------------------------------------
    # MIME Types
    # --------------------------------------------------------

    include /etc/nginx/mime.types;
    default_type application/octet-stream;


    # --------------------------------------------------------
    # Logging
    # --------------------------------------------------------

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;


    # --------------------------------------------------------
    # Performance
    # --------------------------------------------------------

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;

    types_hash_max_size 2048;

    client_max_body_size 20M;


    # --------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml+rss
        application/json
        application/javascript;


    # ========================================================
    # RATE LIMITING
    # ========================================================

    # --------------------------------------------------------
    # General API Rate Limit
    #
    # 10 requests/sec per IP
    #
    # burst=20 is configured at individual locations.
    # --------------------------------------------------------

    limit_req_zone
        $binary_remote_addr
        zone=general_api:10m
        rate=10r/s;


    # --------------------------------------------------------
    # Authentication Rate Limit
    #
    # 5 requests/minute per IP
    #
    # Protects login/register/authentication endpoints.
    # --------------------------------------------------------

    limit_req_zone
        $binary_remote_addr
        zone=auth_api:10m
        rate=5r/m;


    # --------------------------------------------------------
    # AI Chat Rate Limit
    #
    # 5 requests/minute per IP
    #
    # Protects expensive LLM/RAG requests.
    # --------------------------------------------------------

    limit_req_zone
        $binary_remote_addr
        zone=ai_chat:10m
        rate=5r/m;


    # --------------------------------------------------------
    # Payment Rate Limit
    #
    # 10 requests/minute per IP
    # --------------------------------------------------------

    limit_req_zone
        $binary_remote_addr
        zone=payment_api:10m
        rate=10r/m;


    # --------------------------------------------------------
    # Return HTTP 429 when rate limit is exceeded
    # --------------------------------------------------------

    limit_req_status 429;


    # ========================================================
    # UPSTREAM SERVICES
    # ========================================================

    # --------------------------------------------------------
    # User Service
    # --------------------------------------------------------

    upstream user_service {
        server user-service:8000;
    }


    # --------------------------------------------------------
    # Product Service
    # --------------------------------------------------------

    upstream product_service {
        server product-service:8000;
    }


    # --------------------------------------------------------
    # Cart Service
    # --------------------------------------------------------

    upstream cart_service {
        server cart-service:8000;
    }


    # --------------------------------------------------------
    # Review Service
    # --------------------------------------------------------

    upstream review_service {
        server review-service:8000;
    }


    # --------------------------------------------------------
    # Order Service
    # --------------------------------------------------------

    upstream order_service {
        server order-service:8000;
    }


    # --------------------------------------------------------
    # Payment Service
    # --------------------------------------------------------

    upstream payment_service {
        server payment-service:5000;
    }


    # --------------------------------------------------------
    # Recommendation Service
    # --------------------------------------------------------

    upstream recommendation_service {
        server recommendation-service:8000;
    }


    # ========================================================
    # MAIN SERVER
    # ========================================================

    server {

        listen 80 default_server;

        server_name _;


        # ====================================================
        # SECURITY HEADERS
        # ====================================================

        add_header X-Frame-Options "SAMEORIGIN" always;

        add_header X-Content-Type-Options "nosniff" always;

        add_header X-XSS-Protection "1; mode=block" always;

        add_header Referrer-Policy
            "strict-origin-when-cross-origin"
            always;


        # ====================================================
        # ROOT
        # ====================================================

        location / {

            return 200
                "Buyzaar E-Commerce Microservices API Gateway\n";

            add_header Content-Type text/plain;
        }


        # ====================================================
        # HEALTH CHECK
        #
        # No rate limiting.
        # Monitoring systems should always be able to check
        # gateway health.
        # ====================================================

        location /health {

            access_log off;

            return 200 "healthy\n";

            add_header Content-Type text/plain;
        }


        # ====================================================
        # USER SERVICE
        # ====================================================

        location /auth {

            # Strict authentication rate limit
            limit_req zone=auth_api burst=5 nodelay;

            proxy_pass http://user_service/auth;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;


            proxy_connect_timeout 60s;

            proxy_send_timeout 60s;

            proxy_read_timeout 60s;
        }


        # ====================================================
        # PRODUCT SERVICE
        # ====================================================

        location /api/products {

            # General API rate limit
            limit_req zone=general_api burst=20 nodelay;

            proxy_pass http://product_service/api/products;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;


            proxy_connect_timeout 60s;

            proxy_send_timeout 60s;

            proxy_read_timeout 60s;


            # Product image upload support
            client_max_body_size 50M;
        }


        # ====================================================
        # CART SERVICE
        # ====================================================

        location /api/carts {

            limit_req zone=general_api burst=20 nodelay;

            proxy_pass http://cart_service/api/carts;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;


            proxy_connect_timeout 60s;

            proxy_send_timeout 60s;

            proxy_read_timeout 60s;


            client_max_body_size 50M;
        }


        # ====================================================
        # REVIEW SERVICE
        # ====================================================

        location /review {

            limit_req zone=general_api burst=20 nodelay;

            proxy_pass http://review_service/review;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;


            proxy_connect_timeout 60s;

            proxy_send_timeout 60s;

            proxy_read_timeout 60s;


            client_max_body_size 50M;
        }


        # ====================================================
        # ORDER SERVICE
        # ====================================================

        location /orders {

            limit_req zone=general_api burst=20 nodelay;

            proxy_pass http://order_service/orders;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;


            proxy_connect_timeout 60s;

            proxy_send_timeout 60s;

            proxy_read_timeout 60s;


            client_max_body_size 50M;
        }


        # ====================================================
        # PAYMENT SERVICE
        # ====================================================

        location /payments {

            # Payment-specific rate limit
            limit_req zone=payment_api burst=5 nodelay;

            proxy_pass http://payment_service/payments;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;


            proxy_connect_timeout 60s;

            proxy_send_timeout 60s;

            proxy_read_timeout 60s;


            client_max_body_size 50M;
        }


        # ====================================================
        # CASHFREE WEBHOOK
        #
        # No normal IP rate limit.
        #
        # Payment service MUST verify Cashfree webhook
        # signature before processing the event.
        # ====================================================

        location /webhook/cashfree {

            proxy_pass
                http://payment_service/webhook/cashfree;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;


            proxy_connect_timeout 60s;

            proxy_send_timeout 60s;

            proxy_read_timeout 60s;


            client_max_body_size 50M;
        }


        # ====================================================
        # RECOMMENDATION SERVICE - RAG
        # ====================================================

        location /api/rag {

            # General API protection
            limit_req zone=general_api burst=10 nodelay;

            proxy_pass
                http://recommendation_service/api/rag;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;


            proxy_connect_timeout 60s;

            proxy_send_timeout 300s;

            proxy_read_timeout 300s;


            client_max_body_size 50M;
        }


        # ====================================================
        # RECOMMENDATION SERVICE - AI CHAT
        # ====================================================

        location /api/chat {

            # Strict AI rate limit
            #
            # Prevents excessive Groq / RAG requests.
            limit_req zone=ai_chat burst=3 nodelay;

            proxy_pass
                http://recommendation_service/api/chat;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;


            # AI requests can take longer
            proxy_connect_timeout 60s;

            proxy_send_timeout 300s;

            proxy_read_timeout 300s;


            client_max_body_size 50M;
        }


        # ====================================================
        # INNGEST
        # ====================================================

        location /api/inngest {

            # Inngest manages event delivery.
            # Keep this separate from user-facing AI limits.

            proxy_pass
                http://recommendation_service/api/inngest;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;


            proxy_connect_timeout 60s;

            proxy_send_timeout 300s;

            proxy_read_timeout 300s;


            client_max_body_size 50M;
        }


        # ====================================================
        # 404 HANDLER
        # ====================================================

        error_page 404 /404;


        location = /404 {

            internal;

            default_type application/json;

            return 404
                '{"error":"Route not found"}';
        }
    }
}