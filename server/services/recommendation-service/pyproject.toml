[project]
name = "recommendation-service"
version = "0.1.0"
description = "AI-powered recommendation service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "python-jose[cryptography]>=3.5.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
